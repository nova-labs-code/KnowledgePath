<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten Lessons</title>
<link rel="stylesheet" href="style.css">
<style>
.back-button {
  margin-top: 20px;
  padding: 10px 15px;
  background: #007BFF;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.back-button:hover { background: #0056b3; }

.lesson-section button {
  margin: 5px;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
}
.lesson-section { margin-top: 15px; }
</style>
</head>
<body>

<!-- Banner -->
<div class="banner-container">
  <img src="logos/bannerLogo.png" alt="Knowledge Path Banner" class="banner-logo">
</div>

<!-- Lessons List -->
<div id="grades-container">
  <div class="grade-card">
    <a href="#" class="grade-link" onclick="loadLesson(1); return false;">
      <h2 class="grade-name">Lesson 1</h2>
      <p>Reading: Letters A & B | Math: Count 1–5 | Science: Animals</p>
    </a>
  </div>
  <div class="grade-card">
    <a href="#" class="grade-link" onclick="loadLesson(2); return false;">
      <h2 class="grade-name">Lesson 2</h2>
      <p>Reading: Letters C & D | Math: Count 6–10 | Science: Plants</p>
    </a>
  </div>
  <!-- Repeat for all 180 lessons -->
</div>

<!-- Lesson Container -->
<div id="lesson-container" style="display:none;"></div>

<script>
// References
const gradesContainer = document.getElementById('grades-container');
const lessonContainer = document.getElementById('lesson-container');

// Function to load a lesson
function loadLesson(number) {
  // Hide lessons list
  gradesContainer.style.display = "none";
  lessonContainer.style.display = "block";
  lessonContainer.innerHTML = ""; // clear previous

  // Load lesson using ES6 module import (works on GitHub Pages)
  const script = document.createElement('script');
  script.type = "module";
  script.src = `./k/lesson${number}.js`; // <-- Exact path
  lessonContainer.appendChild(script);

  // Add Back Button
  const backBtn = document.createElement('button');
  backBtn.textContent = "← Back to All Lessons";
  backBtn.className = "back-button";
  backBtn.onclick = () => {
    lessonContainer.style.display = "none";
    gradesContainer.style.display = "flex";
    lessonContainer.innerHTML = "";
  };
  lessonContainer.appendChild(backBtn);
}
</script>

</body>
</html>
