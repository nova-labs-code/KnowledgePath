<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten Lessons</title>

<link rel="stylesheet" href="style.css">

<style>
/* lesson container */
#lesson-container {
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
  display: none;
}

/* lesson buttons */
.lesson-section button {
  margin: 6px;
  padding: 14px 18px;
  font-size: 1.1rem;
  border-radius: 10px;
  border: none;
  background: #007BFF;
  color: white;
  cursor: pointer;
}

.lesson-section button:hover {
  background: #0056b3;
}

/* hard refresh button */
#hard-refresh-btn {
  display: block;
  margin: 40px auto 20px auto;
  padding: 12px 18px;
  font-size: 1rem;
  border-radius: 10px;
  border: none;
  background: #444;
  color: white;
  cursor: pointer;
}

#hard-refresh-btn:hover {
  background: #222;
}
</style>
</head>

<body>

<!-- Banner -->
<div class="banner-container">
  <img src="logos/bannerLogo.png" class="banner-logo" alt="Knowledge Path">
</div>

<!-- Lessons List -->
<div id="grades-container">
  <div class="grade-card">
    <a href="#" class="grade-link" onclick="loadLesson(1); return false;">
      <div class="grade-name">Lesson 1</div>
      <div class="grade-desc">Reading • Math • Science</div>
    </a>
  </div>

  <!-- duplicate cards up to 180 -->
</div>

<!-- Lesson Output -->
<div id="lesson-container"></div>

<!-- Hard Refresh -->
<button id="hard-refresh-btn">🔄 Reload Page</button>

<script>
const gradesContainer = document.getElementById("grades-container");
const lessonContainer = document.getElementById("lesson-container");

/* ---------- LOAD LESSON ---------- */
function loadLesson(num) {
  gradesContainer.style.display = "none";
  lessonContainer.style.display = "block";
  lessonContainer.innerHTML = "";

  // remove old lesson script
  const oldScript = document.getElementById("lesson-script");
  if (oldScript) oldScript.remove();

  // load lesson script
  const script = document.createElement("script");
  script.src = `k/lesson${num}.js`;
  script.id = "lesson-script";
  document.body.appendChild(script);

  // back button
  const backBtn = document.createElement("button");
  backBtn.textContent = "← Back to Lessons";
  backBtn.style.marginBottom = "20px";
  backBtn.onclick = () => {
    lessonContainer.style.display = "none";
    gradesContainer.style.display = "flex";
    lessonContainer.innerHTML = "";
    const s = document.getElementById("lesson-script");
    if (s) s.remove();
  };

  lessonContainer.appendChild(backBtn);
}

/* ---------- HARD REFRESH ---------- */
document.getElementById("hard-refresh-btn").onclick = () => {
  location.reload();
};
</script>

</body>
</html>
