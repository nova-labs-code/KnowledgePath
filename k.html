<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten Lessons</title>
<link rel="stylesheet" href="style.css">
<style>
/* Optional: style back button */
.back-button {
  margin-top: 20px;
  padding: 10px 15px;
  background: #007BFF;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.back-button:hover {
  background: #0056b3;
}
.lesson-section button {
  margin: 5px;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
}
.lesson-section {
  margin-top: 15px;
}
</style>
</head>
<body>

<!-- Banner -->
<div class="banner-container">
  <img src="logos/bannerLogo.png" alt="Knowledge Path Banner" class="banner-logo">
</div>

<!-- Lessons List -->
<div id="grades-container">
  <div class="grade-card">
    <a href="#" class="grade-link" onclick="loadLesson(1); return false;">
      <h2 class="grade-name">Lesson 1</h2>
      <p>Reading: Letters A & B | Math: Count 1–5 | Science: Animals</p>
    </a>
  </div>
  <div class="grade-card">
    <a href="#" class="grade-link" onclick="loadLesson(2); return false;">
      <h2 class="grade-name">Lesson 2</h2>
      <p>Reading: Letters C & D | Math: Count 6–10 | Science: Plants</p>
    </a>
  </div>
  <!-- Continue up to Lesson 180 -->
</div>

<!-- Lesson Container -->
<div id="lesson-container" style="display:none;"></div>

<script>
const gradesContainer = document.getElementById('grades-container');
const lessonContainer = document.getElementById('lesson-container');

function loadLesson(number) {
  // Clear and hide lessons
  gradesContainer.style.display = "none";
  lessonContainer.style.display = "block";
  lessonContainer.innerHTML = "";

  // Remove old lesson script if exists
  const oldScript = document.getElementById('lesson-script');
  if(oldScript) oldScript.remove();

  // Append new lesson script
  const script = document.createElement('script');
  script.src = `k/lesson${number}.js`; // Exact path to your lesson JS
  script.id = "lesson-script";
  document.body.appendChild(script);

  // Add Back Button AFTER lesson content loads
  const backBtn = document.createElement('button');
  backBtn.textContent = "← Back to All Lessons";
  backBtn.className = "back-button";
  backBtn.onclick = () => {
    lessonContainer.style.display = "none";
    gradesContainer.style.display = "flex";
    lessonContainer.innerHTML = "";
    if(document.getElementById('lesson-script')) {
      document.getElementById('lesson-script').remove();
    }
  };
  lessonContainer.appendChild(backBtn);
}
</script>

</body>
</html>
