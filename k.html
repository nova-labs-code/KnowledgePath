<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten - Knowledge Path</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
  .header { text-align: center; padding: 20px 0; }
  .banner-logo { max-width: 400px; width: 90%; height: auto; }
  .grade-main { max-width: 900px; margin: auto; padding: 20px; }
  h2 { color: #007BFF; margin-bottom: 15px; }
  ul.lesson-list { list-style: none; padding: 0; margin: 0; }
  ul.lesson-list li { background: #fff; border: 1px solid #ddd; padding: 12px 15px; margin-bottom: 6px;
                      border-radius: 8px; cursor: pointer; transition: background 0.2s; }
  ul.lesson-list li:hover { background: #e6f0ff; }
  li h3 { display: inline; color: #007BFF; margin: 0; font-weight: bold; }
  li p { margin: 4px 0 0 0; font-size: 0.9rem; color: #555; }
</style>
</head>
<body>

<header class="header">
  <img src="logos/bannerLogo.png" alt="Knowledge Path Banner" class="banner-logo">
</header>

<main class="grade-main">
  <h2>Kindergarten Lessons</h2>
  <ul id="lessons-list" class="lesson-list"></ul>
</main>

<script>
const gradeFolder = "k"; // Folder for this grade
const lessonsList = document.getElementById('lessons-list');

// --- Generate lesson overview (all 180) ---
function generateLessonSubjects(lessonNumber) {
  let reading = "Letters and simple words.";
  let math = "Counting numbers and recognizing shapes.";
  let science = "Animals, plants, and simple observations.";

  if (lessonNumber >= 20 && lessonNumber < 40) {
    reading = "Sight words and simple sentences.";
    math = "Patterns and simple addition/subtraction.";
    science = "Weather, seasons, and environment.";
  } else if (lessonNumber >= 40 && lessonNumber < 60) {
    reading = "Short stories and comprehension.";
    math = "Comparing sizes and basic problem-solving.";
    science = "Experiments with water, magnets, or seeds.";
  } else if (lessonNumber >= 60) {
    reading = "Simple sentence writing.";
    math = "Simple measurements and applied math.";
    science = "Exploring senses, habitats, and daily experiments.";
  }

  return { reading, math, science };
}

// --- Create all 180 lessons in a list ---
for (let i = 1; i <= 180; i++) {
  const subjects = generateLessonSubjects(i);

  const li = document.createElement('li');

  // Click to load lesson JS dynamically
  li.addEventListener('click', () => {
    loadLessonJS(i);
  });

  li.innerHTML = `<h3>Lesson ${i}</h3>
                  <p><strong>Reading:</strong> ${subjects.reading}<br>
                     <strong>Math:</strong> ${subjects.math}<br>
                     <strong>Science:</strong> ${subjects.science}</p>`;

  lessonsList.appendChild(li);
}

// --- Function to dynamically load lesson JS ---
function loadLessonJS(lessonNumber) {
  // Remove any previous lesson script
  const existingScript = document.getElementById('lesson-script');
  if (existingScript) existingScript.remove();

  // Load new lesson JS
  const script = document.createElement('script');
  script.src = `${gradeFolder}/lesson${lessonNumber}.js`;
  script.id = 'lesson-script';
  document.body.appendChild(script);

  // Optionally scroll to top for the lesson content
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
