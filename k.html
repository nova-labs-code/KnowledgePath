<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindergarten - Knowledge Path</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <img src="logos/bannerLogo.png" alt="Knowledge Path Banner" class="banner-logo">
</header>

<main class="grade-main">
  <h2 id="grade-title">Kindergarten</h2>
  <div id="lesson-container" class="lessons-container"></div>

  <div class="lesson-navigation">
    <button id="prev-lesson">← Previous</button>
    <button id="next-lesson">Next →</button>
  </div>

  <div class="back-link">
    <a href="index.html">← Back to K–12 Grades</a>
  </div>
</main>

<script>
  // --- Kindergarten lessons ---
  const lessons = [
    "Lesson 1: Welcome & Introduction",
    "Lesson 2: Colors & Shapes",
    "Lesson 3: Alphabet Basics",
    "Lesson 4: Numbers 1-10",
    "Lesson 5: Fun Activities",
    "Lesson 6: Drawing & Shapes",
    "Lesson 7: Simple Patterns",
    "Lesson 8: Story Time",
    "Lesson 9: Counting Objects",
    "Lesson 10: Rhymes & Songs",
    "Lesson 11: Days of the Week",
    "Lesson 12: Basic Emotions",
    "Lesson 13: Animals & Sounds",
    "Lesson 14: Nature Exploration",
    "Lesson 15: Review & Quiz"
  ];

  const grade = "k"; // use "k" for Kindergarten
  const urlParams = new URLSearchParams(window.location.search);
  let lessonIndex = parseInt(urlParams.get('lesson') || "0");

  const lessonContainer = document.getElementById('lesson-container');

  function renderLesson() {
    lessonContainer.textContent = lessons[lessonIndex];
    loadLessonJS(lessonIndex + 1); // Load grade-lessonX.js
  }

  renderLesson();

  // --- Navigation ---
  document.getElementById('prev-lesson').addEventListener('click', () => {
    if (lessonIndex > 0) lessonIndex--;
    updateURL();
    renderLesson();
  });

  document.getElementById('next-lesson').addEventListener('click', () => {
    if (lessonIndex < lessons.length - 1) lessonIndex++;
    updateURL();
    renderLesson();
  });

  function updateURL() {
    const newUrl = `${window.location.pathname}?lesson=${lessonIndex}`;
    window.history.replaceState({}, '', newUrl);
  }

  // --- Load external JS file for this lesson ---
  function loadLessonJS(lessonNumber) {
    const existingScript = document.getElementById('lesson-script');
    if (existingScript) existingScript.remove();

    const script = document.createElement('script');
    script.src = `lessons/${grade}-lesson${lessonNumber}.js`;
    script.id = 'lesson-script';
    document.body.appendChild(script);
  }
</script>

</body>
</html>
