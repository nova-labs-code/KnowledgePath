<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten Lessons</title>
<link rel="stylesheet" href="style.css">
<style>
.back-button {
  margin-top: 20px;
  padding: 10px 15px;
  background: #007BFF;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.back-button:hover { background: #0056b3; }

.lesson-section button {
  margin: 5px;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
}
.lesson-section { margin-top: 15px; }
</style>
</head>
<body>

<!-- Banner -->
<div class="banner-container">
  <img src="logos/bannerLogo.png" alt="Knowledge Path Banner" class="banner-logo">
</div>

<!-- Lessons List -->
<div id="grades-container">
  <div class="grade-card">
    <a href="#" class="grade-link" onclick="loadLesson(1); return false;">
      <h2 class="grade-name">Lesson 1</h2>
      <p>Reading: Letters A & B | Math: Counting 1–5 | Science: Animals</p>
    </a>
  </div>
</div>

<!-- Lesson Container -->
<div id="lesson-container" style="display:none;"></div>

<script>
const gradesContainer = document.getElementById('grades-container');
const lessonContainer = document.getElementById('lesson-container');

function loadLesson(number) {
  gradesContainer.style.display = "none";
  lessonContainer.style.display = "block";
  lessonContainer.innerHTML = ""; // clear previous content

  // Call the render function of the lesson
  if(number === 1 && typeof renderLesson1 === "function") renderLesson1(lessonContainer);
  // Add more conditions for other lessons: renderLesson2, renderLesson3, etc.

  // Back Button
  const backBtn = document.createElement('button');
  backBtn.textContent = "← Back to All Lessons";
  backBtn.className = "back-button";
  backBtn.onclick = () => {
    lessonContainer.style.display = "none";
    gradesContainer.style.display = "flex";
    lessonContainer.innerHTML = "";
  };
  lessonContainer.appendChild(backBtn);

  // Dynamically load lesson script only if not already loaded
  if(!document.getElementById(`lesson-script-${number}`)) {
    const script = document.createElement('script');
    script.src = `k/lesson${number}.js`;
    script.id = `lesson-script-${number}`;
    document.body.appendChild(script);
  }

  lessonContainer.scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
