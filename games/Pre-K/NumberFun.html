<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Fun</title>
<style>
body { font-family: Arial; text-align: center; padding: 20px; }
button { margin-top: 10px; padding: 8px 12px; }
</style>
</head>
<body>
<h1>Number Fun</h1>
<p id="stars"></p>
<input type="number" id="answer" placeholder="Type the number">
<button id="submitBtn">Submit</button>
<p id="feedback"></p>
<button onclick="goBack()">Back to Hub</button>

<script>
const number = Math.floor(Math.random() * 5) + 1;
document.getElementById("stars").textContent = "⭐".repeat(number);

document.getElementById("submitBtn").onclick = () => {
  const ans = parseInt(document.getElementById("answer").value);
  document.getElementById("feedback").textContent =
    ans === number ? "Correct! 🎉" : `Oops! The number was ${number}`;
};

function goBack() { window.history.back(); }
</script>
</body>
</html>
