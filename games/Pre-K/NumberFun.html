<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Fun</title>
<style>
  body { font-family: Arial; text-align: center; padding: 20px; max-width: 500px; margin: auto; }
  h1 { font-size: 2em; margin-bottom: 10px; }
  p { font-size: 1.2em; }
  input { font-size: 1.5em; padding: 10px; width: 60%; }
  button { font-size: 1.5em; padding: 12px 24px; margin-top: 10px; }
</style>
</head>
<body>

<h1>Number Fun</h1>
<p id="questionText">Get ready!</p>
<input type="number" inputmode="numeric" id="answer" placeholder="Type number">
<button id="submitBtn">Submit</button>
<p id="feedback"></p>
<p id="progress"></p>
<button id="backBtn" style="display:none;" onclick="goBack()">Back to Hub</button>

<script>
const totalQuestions = 10;
let currentQuestion = 0;
let score = 0;

// Generate 10 unique numbers (1-5, no repeats)
const numbersSet = new Set();
while(numbersSet.size < totalQuestions) {
  numbersSet.add(Math.floor(Math.random() * 5) + 1);
}
const questions = Array.from(numbersSet);

const questionText = document.getElementById("questionText");
const answerInput = document.getElementById("answer");
const feedback = document.getElementById("feedback");
const progress = document.getElementById("progress");
const submitBtn = document.getElementById("submitBtn");
const backBtn = document.getElementById("backBtn");

function showQuestion() {
  if (currentQuestion >= totalQuestions) {
    questionText.textContent = `🎉 Game Over! You scored ${score} / ${totalQuestions}`;
    answerInput.style.display = "none";
    submitBtn.style.display = "none";
    feedback.style.display = "none";
    progress.style.display = "none";
    backBtn.style.display = "inline-block";
    return;
  }

  const stars = "⭐".repeat(questions[currentQuestion]);
  questionText.textContent = `Question ${currentQuestion + 1}: How many stars are shown?`;
  feedback.textContent = stars;
  progress.textContent = `Score: ${score} / ${currentQuestion}`;
}

submitBtn.onclick = () => {
  const userAnswer = parseInt(answerInput.value);
  if (userAnswer === questions[currentQuestion]) score++;
  currentQuestion++;
  answerInput.value = "";
  showQuestion();
};

function goBack() {
  window.history.back();
}

// Start the game
showQuestion();
</script>

</body>
</html>
