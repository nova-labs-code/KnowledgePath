<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-K Lessons</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #f9f9f9;
    margin:0;
    padding:0;
  }
  header {
    background: #ffda9e;
    text-align:center;
    padding:20px 10px;
  }
  header img {
    width: 180px;
    height: auto;
    margin-bottom:10px;
  }
  header h1 {
    margin:0;
    font-size:1.8em;
    color:#333;
  }
  main {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap:20px;
    padding:20px;
  }
  .subject-card {
    background:white;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    padding:15px;
    text-align:center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .subject-card:hover {
    transform: translateY(-5px);
    box-shadow:0 8px 15px rgba(0,0,0,0.15);
  }
  .subject-card h2 {
    color:#ff8c42;
    margin:0 0 10px 0;
  }
  .subject-card p {
    font-size:0.9em;
    color:#555;
    margin:5px 0 0 0;
  }
  .subject-card button {
    margin-top:10px;
    padding:8px 12px;
    background:#ff8c42;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
  }
  .subject-card button:hover {
    background:#e57c24;
  }
</style>
</head>
<body>

<header>
  <img src="../bannerLogo.png" alt="Pre-K Logo">
  <h1>Pre-K Lessons</h1>
</header>

<main id="subjects-container">
  <!-- Subject cards generated by JS -->
</main>

<script type="module">
  // Pre-K subjects
  const subjects = [
    { name:'Math', file:'math.html', description:'Counting, addition, subtraction.' },
    { name:'Language', file:'language.html', description:'Letters, phonics, simple words.' },
    { name:'Science', file:'science.html', description:'Colors, shapes, animals, nature.' },
    { name:'Art & Creativity', file:'art.html', description:'Drawing, colors, creative activities.' }
  ];

  const container = document.getElementById('subjects-container');

  // Calculate today’s lesson (day-of-year modulo 180)
  const today = new Date();
  const startOfYear = new Date(today.getFullYear(),0,0);
  const diff = today - startOfYear;
  const oneDay = 1000*60*60*24;
  const dayOfYear = Math.floor(diff/oneDay);
  const lessonNumber = (dayOfYear % 180) + 1;

  subjects.forEach(sub => {
    const card = document.createElement('div');
    card.className='subject-card';
    card.innerHTML=`
      <h2>${sub.name}</h2>
      <p>${sub.description}</p>
      <button>Go to Today's Lesson</button>
    `;
    card.querySelector('button').addEventListener('click',()=>{
      window.location.href = `${sub.file}?lesson=${lessonNumber}`;
    });
    container.appendChild(card);
  });
</script>

</body>
</html>
