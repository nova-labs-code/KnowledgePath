<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-K Lessons - Knowledge Path</title>
  <link rel="icon" href="../../logos/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../../style.css">
</head>
<body>

  <div class="banner-container">
    <img src="../../logos/bannerLogo.png" alt="Knowledge Path Banner" class="banner-logo">
  </div>

  <h1 style="text-align:center; margin-bottom: 30px;">Pre-K Lessons</h1>

  <div id="lessons-container"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const totalLessons = 180;
      const subjects = ["Math", "Language", "Science"];
      const container = document.getElementById("lessons-container");

      for (let i = 0; i < totalLessons; i++) {
        const lessonCard = document.createElement("div");
        lessonCard.classList.add("grade-card");

        const lessonTitle = document.createElement("h2");
        lessonTitle.textContent = `Lesson ${i + 1}`;
        lessonTitle.classList.add("grade-name");
        lessonCard.appendChild(lessonTitle);

        subjects.forEach(subject => {
          const lessonNumber = i + 1;

          const subjLink = document.createElement("a");
          subjLink.href = `${subject.toLowerCase()}.html?lesson=${lessonNumber}`;
          subjLink.style.textDecoration = "none";
          subjLink.style.color = "inherit";

          const subjLabel = document.createElement("p");
          subjLabel.textContent = subject;
          subjLabel.classList.add("grade-desc");
          subjLink.appendChild(subjLabel);

          const subjFile = document.createElement("p");
          subjFile.textContent = `File: ${subject.toLowerCase()}.html?lesson=${lessonNumber}`;
          subjFile.style.fontStyle = "italic";
          subjFile.style.color = "#555";
          subjLink.appendChild(subjFile);

          lessonCard.appendChild(subjLink);
        });

        container.appendChild(lessonCard);
      }
    });
  </script>

</body>
</html>
