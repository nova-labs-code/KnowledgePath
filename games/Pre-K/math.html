<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-K Math Lessons</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #f9f9f9;
    margin:0;
    padding:0;
  }
  header {
    background: #ffda9e;
    text-align:center;
    padding: 20px 10px;
  }
  header img {
    width: 180px;
    height: auto;
    margin-bottom: 10px;
  }
  header h1 {
    margin:0;
    font-size:1.8em;
    color: #333;
  }
  main {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap:15px;
    padding:20px;
  }
  .lesson-card {
    background:white;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    padding:12px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .lesson-card:hover {
    transform: translateY(-5px);
    box-shadow:0 8px 15px rgba(0,0,0,0.15);
  }
  .lesson-card h2 {
    margin-top:0;
    font-size:1.1em;
    color:#ff8c42;
  }
  .lesson-card p {
    font-size:0.85em;
    color:#555;
    margin:5px 0 0 0;
  }
  .lesson-card a {
    display:block;
    margin-top:10px;
    text-align:center;
    text-decoration:none;
    background:#ff8c42;
    color:white;
    padding:6px;
    border-radius:8px;
    font-weight:bold;
  }
  .lesson-card a:hover {
    background:#e57c24;
  }
</style>
</head>
<body>

<header>
  <img src="../bannerLogo.png" alt="Pre-K Logo">
  <h1>Math Lessons</h1>
</header>

<main id="lessons-container">
  <!-- Lesson cards will be generated here -->
</main>

<script type="module">
import { mathGames } from './math.js';

const container = document.getElementById('lessons-container');

// Generate all 180 lesson cards dynamically
for(let i=1;i<=180;i++){
  const card = document.createElement('div');
  card.className = 'lesson-card';
  card.innerHTML = `
    <h2>Lesson ${i}</h2>
    <p>Math fun: Counting, numbers, addition & subtraction.</p>
    <p>Recommended: 10–20 min</p>
    <a href="lesson.html?lesson=${i}">Go to Lesson</a>
  `;
  container.appendChild(card);
}
</script>

</body>
</html>
