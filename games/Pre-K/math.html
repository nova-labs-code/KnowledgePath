<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-K Math Lesson</title>
  <link rel="icon" href="../../logos/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../../style.css">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../../logos/btnLogo.png">
</head>
<body>

  <div class="banner-container">
    <img src="../../logos/bannerLogo.png" alt="Knowledge Path Banner" class="banner-logo">
  </div>

  <h1 style="text-align:center; margin-bottom: 20px;">Math Lesson</h1>
  <h2 id="lesson-number" style="text-align:center; margin-bottom: 30px;"></h2>

  <div style="text-align:center;">
    <button id="start-game-btn" style="padding:15px 30px; font-size:1.2em; cursor:pointer;">
      Start Game
    </button>
  </div>

  <div id="game-container" style="margin-top: 40px;"></div>

  <script type="module">
    import { mathGames } from "./math.js";

    function getLessonNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      const lesson = parseInt(urlParams.get("lesson"));
      if (!lesson || lesson < 1 || lesson > 180) return 1;
      return lesson;
    }

    const lessonNumber = getLessonNumber();
    document.getElementById("lesson-number").textContent = `Lesson ${lessonNumber}`;

    const startBtn = document.getElementById("start-game-btn");
    const gameContainer = document.getElementById("game-container");

    startBtn.addEventListener("click", () => {
      gameContainer.innerHTML = "";
      if (mathGames[lessonNumber]) {
        mathGames[lessonNumber](gameContainer);
      } else {
        gameContainer.textContent = "Game not found!";
      }
    });

    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        window.location.href = link.href;
      });
    });
  </script>

</body>
</html>
