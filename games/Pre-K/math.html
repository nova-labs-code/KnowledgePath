<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-K Math</title>

<style>
body {
  font-family: system-ui, sans-serif;
  background:#f6f7fb;
  margin:0;
}

header {
  background:#ffda9e;
  text-align:center;
  padding:16px;
  font-size:1.6em;
  font-weight:bold;
}

#game {
  max-width:520px;
  margin:20px auto;
  background:white;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
  padding:24px;
  text-align:center;
}

.objects span {
  font-size:2.5em;
  margin:8px;
}

input {
  font-size:1.3em;
  padding:8px;
  width:100px;
  text-align:center;
}

button {
  margin-top:16px;
  padding:10px 20px;
  font-size:1.1em;
  border:none;
  border-radius:12px;
  background:#ff8c42;
  color:white;
  font-weight:600;
}
#feedback {
  margin-top:14px;
  font-weight:bold;
}
</style>
</head>

<body>

<header id="title"></header>

<div id="game">
  <div id="instruction"></div>
  <div id="content" class="objects"></div>
  <div id="controls"></div>
  <div id="feedback"></div>
</div>

<script>
/* ================= LESSON ENGINE ================= */

const lesson = Number(new URLSearchParams(location.search).get("lesson")) || 1;
document.getElementById("title").textContent = `Math – Lesson ${lesson}`;

const instruction = document.getElementById("instruction");
const content = document.getElementById("content");
const controls = document.getElementById("controls");
const feedback = document.getElementById("feedback");

let question = 0;
const maxQuestions = 5;
const level = Math.min(5, Math.ceil(lesson / 10));

/* ================= GAME REGISTRY ================= */

const Games = {

  counting: {
    start() {
      instruction.textContent = "Count the objects and type the number";
      this.next();
    },
    next() {
      question++;
      content.innerHTML = "";
      controls.innerHTML = "";
      feedback.textContent = "";

      this.answer = level + Math.floor(Math.random() * 2);

      for (let i = 0; i < this.answer; i++) {
        const s = document.createElement("span");
        s.textContent = "🍎";
        content.appendChild(s);
      }

      controls.innerHTML = `
        <input id="input" type="number">
        <button onclick="check()">Check</button>
      `;
    },
    check() {
      const val = Number(document.getElementById("input").value);
      feedback.textContent = val === this.answer ? "Great job!" : "Try again";
      if (val === this.answer) nextQuestion();
    }
  },

  numberTyping: {
    start() {
      instruction.textContent = "Type the number you see";
      this.next();
    },
    next() {
      question++;
      content.textContent = this.answer = Math.floor(Math.random() * level) + 1;
      content.style.fontSize = "3em";
      controls.innerHTML = `
        <input id="input" type="number">
        <button onclick="check()">Check</button>
      `;
    },
    check() {
      const val = Number(document.getElementById("input").value);
      feedback.textContent = val === this.answer ? "Correct!" : "Try again";
      if (val === this.answer) nextQuestion();
    }
  },

  compare: {
    start() {
      instruction.textContent = "Which side has more? Type left or right";
      this.next();
    },
    next() {
      question++;
      const left = level;
      const right = level + 1;
      this.answer = "right";

      content.innerHTML = `
        ${"⭐".repeat(left)} &nbsp;&nbsp; ${"⭐".repeat(right)}
      `;

      controls.innerHTML = `
        <input id="input">
        <button onclick="check()">Check</button>
      `;
    },
    check() {
      const val = document.getElementById("input").value.toLowerCase();
      feedback.textContent = val === this.answer ? "Nice!" : "Try again";
      if (val === this.answer) nextQuestion();
    }
  }

};

/* ================= LESSON FLOW ================= */

const lessonGames = [
  "counting",
  "numberTyping",
  "compare"
];

const gameName =
  lesson <= 50
    ? lessonGames[Math.floor((lesson - 1) / 17)]
    : lessonGames[Math.floor(Math.random() * lessonGames.length)];

const game = Games[gameName];

function nextQuestion() {
  if (question >= maxQuestions) {
    instruction.textContent = "Lesson Complete!";
    content.textContent = "🎉";
    controls.innerHTML = "";
    return;
  }
  game.next();
}

window.check = () => game.check();
game.start();
</script>

</body>
</html>
