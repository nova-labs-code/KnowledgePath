<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-K Math</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f9f9f9;
  margin:0;
}

header {
  background:#ffda9e;
  text-align:center;
  padding:20px;
}

main {
  display:flex;
  justify-content:center;
  padding:20px;
}

#game {
  background:#fff;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
  padding:20px;
  max-width:420px;
  width:100%;
  text-align:center;
}

.objects span {
  font-size:2.2em;
  margin:6px;
}

input {
  font-size:1.2em;
  padding:6px;
  width:80px;
  text-align:center;
}

button {
  margin-top:10px;
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#ff8c42;
  color:#fff;
  font-weight:bold;
}

#msg {
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>Pre-K Math</h1>
</header>

<main>
  <div id="game">
    <h2 id="title"></h2>
    <p id="instruction"></p>
    <div id="content"></div>
    <div id="msg"></div>
  </div>
</main>

<script>
const lesson = Number(new URLSearchParams(location.search).get("lesson")) || 1;
document.getElementById("title").textContent = `Lesson ${lesson}`;

const content = document.getElementById("content");
const msg = document.getElementById("msg");
const instruction = document.getElementById("instruction");

const level = Math.min(5, ((lesson - 1) % 5) + 1);

// ---------- GAME FUNCTIONS ----------

function typingCount() {
  content.innerHTML = `<div class="objects">${"🍎".repeat(level)}</div>
    <p>Type how many apples</p>
    <input id="answer" type="number" />
    <button onclick="check(${level})">Check</button>`;
  window.check = (correct) => {
    msg.textContent =
      Number(document.getElementById("answer").value) === correct
        ? "Great job!"
        : "Try again!";
  };
}

function typingNumber() {
  content.innerHTML = `
    <p>Type this number:</p>
    <div style="font-size:3em">${level}</div>
    <input id="answer" type="number" />
    <button onclick="check(${level})">Check</button>`;
  window.check = (correct) => {
    msg.textContent =
      Number(document.getElementById("answer").value) === correct
        ? "Correct!"
        : "Try again!";
  };
}

function compareTyping() {
  const left = level;
  const right = level + 1;
  content.innerHTML = `
    <div class="objects">
      ${"⭐".repeat(left)} &nbsp; ${"⭐".repeat(right)}
    </div>
    <p>Type which side has more (left or right)</p>
    <input id="answer" />
    <button onclick="check()">Check</button>`;
  window.check = () => {
    msg.textContent =
      document.getElementById("answer").value.toLowerCase() === "right"
        ? "Correct!"
        : "Try again!";
  };
}

function clickShapes() {
  instruction.textContent = "Click all the circles";
  content.innerHTML = "";
  ["🔵","🔺","🔵","⬛"].forEach(s=>{
    const el=document.createElement("span");
    el.textContent=s;
    el.onclick=()=>msg.textContent=(s==="🔵")?"Good!":"Try another";
    content.appendChild(el);
  });
}

function patternClick() {
  content.innerHTML = `
    <div class="objects">🔴 🔵 🔴 🔵 ?</div>
    <button onclick="msg.textContent='Correct!'">🔴</button>
    <button onclick="msg.textContent='Try again!'">🔵</button>`;
}

// ---------- GAME SELECTION ----------

const games = [
  typingCount,
  typingNumber,
  compareTyping,
  clickShapes,
  patternClick
];

// 50 lessons learning, 10 review
const gameIndex =
  lesson <= 50
    ? Math.floor((lesson - 1) / 10)
    : Math.floor(Math.random() * games.length);

instruction.textContent = "Answer the question:";
games[gameIndex]();
</script>

</body>
</html>
