<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Path | K12 Learning</title>
<link rel="icon" href="logos/favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Banner Logo -->
<img src="logos/bannerLogo.png" alt="Knowledge Path" class="banner">

<h1>Knowledge Path</h1>

<!-- Pre-K -->
<div class="grade">
  <h2>Pre-K</h2>

  <div class="subject">
    <h3>Math</h3>
    <button class="game-btn" data-link="games/Pre-K/NumberFun.html">
      <img src="logos/btnLogo.png" alt="Game">Number Fun
    </button>
    <button class="game-btn" data-link="games/Pre-K/ShapeExplorer.html">
      <img src="logos/btnLogo.png" alt="Game">Shape Explorer
    </button>
  </div>

  <div class="subject">
    <h3>Language</h3>
    <button class="game-btn" data-link="games/Pre-K/AlphabetAdventure.html">
      <img src="logos/btnLogo.png" alt="Game">Alphabet Adventure
    </button>
    <button class="game-btn" data-link="games/Pre-K/WordMatch.html">
      <img src="logos/btnLogo.png" alt="Game">Word Match
    </button>
  </div>

  <div class="subject">
    <h3>Science</h3>
    <button class="game-btn" data-link="games/Pre-K/SensesGame.html">
      <img src="logos/btnLogo.png" alt="Game">Senses Game
    </button>
    <button class="game-btn" data-link="games/Pre-K/AnimalExplorer.html">
      <img src="logos/btnLogo.png" alt="Game">Animal Explorer
    </button>
  </div>
</div>

<!-- Add more grades in the same structure -->

<script src="script.js"></script>
</body>
</html>
